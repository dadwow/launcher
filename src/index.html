<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoW Launcher</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Custom Title Bar -->
    <div class="title-bar">
        <div class="title-bar-drag-region"></div>
        <div class="title-bar-controls">
            <button class="title-bar-button" id="settings-button" title="Settings">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
            <button class="title-bar-button" id="minimize-btn" title="Minimize">
                <svg width="12" height="12" viewBox="0 0 12 12">
                    <line x1="0" y1="6" x2="12" y2="6" stroke="currentColor" stroke-width="1"/>
                </svg>
            </button>
            <button class="title-bar-button close-btn" id="close-btn" title="Close">
                <svg width="12" height="12" viewBox="0 0 12 12">
                    <line x1="1" y1="1" x2="11" y2="11" stroke="currentColor" stroke-width="1"/>
                    <line x1="11" y1="1" x2="1" y2="11" stroke="currentColor" stroke-width="1"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="server-info">
                <img src="../assets/logo.png" alt="Server Logo" id="server-logo" class="server-logo">
                <span id="server-name" style="display: none;">Server Name</span>
                <div class="server-status" id="server-status" title="Checking server status...">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="status-text">Checking status...</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Game Status Card -->
            <div class="status-card">
                <div class="status-info">
                    <h3>Game Status</h3>
                    <div id="game-status" class="status-display">
                        <span class="status-icon">⚠️</span>
                        <span>Checking game installation...</span>
                    </div>
                </div>
            </div>

            <!-- Action Area -->
            <div class="action-area">
                <div class="progress-container" id="progress-container" style="display: none;">
                    <div class="progress-info">
                        <span id="progress-text">Preparing...</span>
                        <span id="progress-percentage">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="progress-controls">
                        <button id="pause-button" class="btn btn-small">Pause</button>
                        <button id="cancel-button" class="btn btn-small btn-danger">Cancel</button>
                    </div>
                </div>

                <button id="main-action-button" class="main-action-btn" disabled>
                    <span class="action-icon" id="action-icon">🎮</span>
                    <span class="action-text" id="action-text">Configure Settings</span>
                </button>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-info">
                <span class="launcher-version" id="launcher-version">Launcher v1.0.0</span>
                <span class="separator">•</span>
                <a href="#" id="about-link">About</a>
            </div>
        </footer>

        <!-- Update Notification -->
        <div class="update-notification" id="update-notification" style="display: none;">
            <div class="update-content">
                <span class="update-icon">🔄</span>
                <div class="update-info">
                    <strong id="update-title">Update Available</strong>
                    <span id="update-message">A new version is available</span>
                </div>
                <div class="update-actions">
                    <button id="update-download-btn" class="btn btn-small btn-primary">Download</button>
                    <button id="update-dismiss-btn" class="btn btn-small">Later</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
        <p id="loading-text">Loading...</p>
    </div>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settings-modal" style="display: none;">
        <div class="settings-modal-backdrop"></div>
        <div class="settings-modal-content">
            <iframe id="settings-iframe" src="options.html" frameborder="0"></iframe>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
