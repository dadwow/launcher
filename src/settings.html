<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .settings-container {
            padding: 20px;
            max-width: 100%;
        }

        .settings-group {
            margin-bottom: 25px;
        }

        .settings-group h3 {
            color: #4facfe;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .setting-item {
            margin-bottom: 15px;
        }

        .setting-item label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .setting-item input,
        .setting-item select {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #fff;
            font-size: 0.9em;
        }

        .setting-item input:focus,
        .setting-item select:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 2px rgba(79, 172, 254, 0.2);
        }

        .setting-description {
            font-size: 0.8em;
            color: #aaa;
            margin-top: 5px;
        }

        .settings-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>
    <div class="settings-container">
        <h2>Settings</h2>

        <div class="settings-group">
            <h3>Server Configuration</h3>
            <div class="setting-item">
                <label for="server-name-input">Server Name:</label>
                <input type="text" id="server-name-input" placeholder="Your WoW Server">
                <div class="setting-description">Display name shown in the launcher</div>
            </div>
            <div class="setting-item">
                <label for="download-url-input">Client Download URL:</label>
                <input type="url" id="download-url-input" placeholder="https://example.com/wow-client.zip">
                <div class="setting-description">URL to download the WoW client archive</div>
            </div>
            <div class="setting-item">
                <label for="default-realm-input">Default Realm:</label>
                <input type="text" id="default-realm-input" placeholder="logon.server.com">
                <div class="setting-description">Default realm address for realmlist.wtf</div>
            </div>
        </div>

        <div class="settings-group">
            <h3>Installation</h3>
            <div class="setting-item">
                <label for="install-path-input">WoW Installation Path:</label>
                <input type="text" id="install-path-settings" readonly>
                <div class="setting-description">Directory where WoW client will be installed</div>
            </div>
        </div>

        <div class="settings-group">
            <h3>Launcher</h3>
            <div class="setting-item">
                <label for="window-width-input">Window Width:</label>
                <input type="number" id="window-width-input" min="600" max="1920" value="800">
            </div>
            <div class="setting-item">
                <label for="window-height-input">Window Height:</label>
                <input type="number" id="window-height-input" min="400" max="1080" value="600">
            </div>
        </div>

        <div class="settings-buttons">
            <button id="cancel-button" class="btn btn-secondary">Cancel</button>
            <div>
                <button id="reset-button" class="btn btn-danger">Reset to Defaults</button>
                <button id="save-button" class="btn btn-primary">Save Settings</button>
            </div>
        </div>
    </div>

    <script>
        // Settings functionality would go here
        // For now, just close the window
        document.getElementById('cancel-button').addEventListener('click', () => {
            window.close();
        });

        document.getElementById('save-button').addEventListener('click', () => {
            alert('Settings saved! (Functionality to be implemented)');
            window.close();
        });

        document.getElementById('reset-button').addEventListener('click', () => {
            if (confirm('Reset all settings to defaults?')) {
                alert('Settings reset! (Functionality to be implemented)');
            }
        });
    </script>
</body>

</html>
