name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  
jobs:
  # Job to determine if we should create a release
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Check if should create release
        id: check
        run: |
          if [[ ${{ github.event_name }} == 'push' && ${{ github.ref }} == 'refs/heads/main' ]]; then
            echo "should-release=true" >> $GITHUB_OUTPUT
            
            # Auto-increment patch version
            npm version patch --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "Will create release for version $NEW_VERSION"
          else
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "Skipping release creation"
          fi
      
      - name: Commit version bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json
          git commit -m "Bump version to ${{ steps.check.outputs.version }} [skip ci]"
          git tag -a "v${{ steps.check.outputs.version }}" -m "Release v${{ steps.check.outputs.version }}"
          git push
          git push --tags

  # Build job for all platforms
  build:
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            platform: mac
            artifact-name: macos
          - os: ubuntu-latest  
            platform: linux
            artifact-name: linux
          - os: windows-latest
            platform: win
            artifact-name: windows

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify .env file exists
        run: |
          echo "Checking for .env file..."
          if [ -f ".env" ]; then
            echo ".env file found!"
            echo "Contents:"
            cat .env
          else
            echo "ERROR: .env file not found!"
            exit 1
          fi
        shell: bash

      - name: Install Wine (for macOS cross-compilation)
        if: matrix.os == 'macos-latest'
        run: |
          brew install --cask xquartz wine-stable

      - name: Build application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            npm run build:mac
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            npm run build:linux
          else
            npm run build:win
          fi
        shell: bash

      - name: List build artifacts (Debug)
        run: |
          echo "Contents of dist folder:"
          ls -la dist/ || echo "No dist folder found"
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-build
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.snap
            dist/*.tar.gz
            dist/*.zip
          retention-days: 5

  # Release job - only runs on main branch pushes
  release:
    needs: [check-release, build]
    runs-on: ubuntu-latest
    if: needs.check-release.outputs.should-release == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: |
          echo "=== Artifacts structure ==="
          ls -laR artifacts/
          echo "=== End of artifacts ==="

      - name: Create Release with all artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-release.outputs.version }}
          name: WoW Launcher v${{ needs.check-release.outputs.version }}
          body: |
            ## WoW 3.3.5a Launcher Release v${{ needs.check-release.outputs.version }}

            ### 🚀 **Cross-Platform WoW Launcher**
            A modern, feature-rich launcher for World of Warcraft 3.3.5a with automatic Wine installation and addon management.

            ### 📦 **Downloads:**
            - **Windows**: Download the `Setup.exe` for easy installation or the portable `.exe` for no-install usage
            - **macOS**: Download the `.dmg` file for Mac installation
            - **Linux**: Download the `.AppImage` for universal Linux support, or use `.deb`/`.rpm` for package managers

            ### ✨ **Key Features:**
            - 🍷 **Automatic Wine Installation** - Seamless cross-platform compatibility
            - 🔧 **Smart Action Button** - Context-aware download/launch functionality  
            - 📦 **GitHub Addon Manager** - Easy addon installation from repositories
            - ⚙️ **Environment Configuration** - Customizable via .env file
            - 🎨 **Modern UI** - Clean, responsive interface
            - 🌍 **Cross-Platform** - Windows, macOS, and Linux support

            ### 🛠️ **Installation:**
            1. Download the appropriate file for your operating system
            2. Install/run the application
            3. Configure your WoW installation path and server settings
            4. Launch and enjoy!

            ### 📋 **System Requirements:**
            - **Windows**: Windows 7 or later
            - **macOS**: macOS 10.13 or later
            - **Linux**: Most modern distributions

            Built with ❤️ using Electron and Node.js
          draft: false
          prerelease: false
          files: |
            artifacts/windows-build/*
            artifacts/macos-build/*
            artifacts/linux-build/*
          fail_on_unmatched_files: false