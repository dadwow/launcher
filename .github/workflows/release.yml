name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  
jobs:
  # Job to determine if we should create a release
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if should create release
        id: check
        run: |
          if [[ ${{ github.event_name }} == 'push' && ${{ github.ref }} == 'refs/heads/main' ]]; then
            echo "should-release=true" >> $GITHUB_OUTPUT
            # Extract version from package.json
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Will create release for version $VERSION"
          else
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "Skipping release creation"
          fi

  # Build job for all platforms
  build:
    needs: check-release
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            platform: mac
            artifact-name: macos
          - os: ubuntu-latest  
            platform: linux
            artifact-name: linux
          - os: windows-latest
            platform: win
            artifact-name: windows

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Wine (for macOS cross-compilation)
        if: matrix.os == 'macos-latest'
        run: |
          brew install --cask xquartz wine-stable

      - name: Build application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            npm run build:mac
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            npm run build:linux
          else
            npm run build:win
          fi
        shell: bash

      - name: List build artifacts (Debug)
        run: |
          echo "Contents of dist folder:"
          ls -la dist/ || echo "No dist folder found"
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-build
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.snap
            dist/*.tar.gz
            dist/*.zip
          retention-days: 5

  # Release job - only runs on main branch pushes
  release:
    needs: [check-release, build]
    runs-on: ubuntu-latest
    if: needs.check-release.outputs.should-release == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -la artifacts/*/

      - name: Prepare release files
        run: |
          mkdir -p release-files
          
          # Copy and rename Windows files
          if [ -f "artifacts/windows-build/WoW 3.3.5a Launcher Setup ${{ needs.check-release.outputs.version }}.exe" ]; then
            cp "artifacts/windows-build/WoW 3.3.5a Launcher Setup ${{ needs.check-release.outputs.version }}.exe" "release-files/WoW-Launcher-Setup-v${{ needs.check-release.outputs.version }}.exe"
          fi
          if [ -f "artifacts/windows-build/WoW 3.3.5a Launcher ${{ needs.check-release.outputs.version }}.exe" ]; then
            cp "artifacts/windows-build/WoW 3.3.5a Launcher ${{ needs.check-release.outputs.version }}.exe" "release-files/WoW-Launcher-Portable-v${{ needs.check-release.outputs.version }}.exe"
          fi
          
          # Copy and rename macOS files
          if [ -f "artifacts/macos-build/WoW 3.3.5a Launcher-${{ needs.check-release.outputs.version }}.dmg" ]; then
            cp "artifacts/macos-build/WoW 3.3.5a Launcher-${{ needs.check-release.outputs.version }}.dmg" "release-files/WoW-Launcher-Intel-v${{ needs.check-release.outputs.version }}.dmg"
          fi
          if [ -f "artifacts/macos-build/WoW 3.3.5a Launcher-${{ needs.check-release.outputs.version }}-arm64.dmg" ]; then
            cp "artifacts/macos-build/WoW 3.3.5a Launcher-${{ needs.check-release.outputs.version }}-arm64.dmg" "release-files/WoW-Launcher-AppleSilicon-v${{ needs.check-release.outputs.version }}.dmg"
          fi
          
          # Copy and rename Linux files
          if [ -f "artifacts/linux-build/WoW 3.3.5a Launcher-${{ needs.check-release.outputs.version }}.AppImage" ]; then
            cp "artifacts/linux-build/WoW 3.3.5a Launcher-${{ needs.check-release.outputs.version }}.AppImage" "release-files/WoW-Launcher-v${{ needs.check-release.outputs.version }}.AppImage"
          fi
          if [ -f "artifacts/linux-build/wow-launcher_${{ needs.check-release.outputs.version }}_amd64.deb" ]; then
            cp "artifacts/linux-build/wow-launcher_${{ needs.check-release.outputs.version }}_amd64.deb" "release-files/WoW-Launcher-v${{ needs.check-release.outputs.version }}.deb"
          fi
          if [ -f "artifacts/linux-build/wow-launcher-${{ needs.check-release.outputs.version }}.tar.gz" ]; then
            cp "artifacts/linux-build/wow-launcher-${{ needs.check-release.outputs.version }}.tar.gz" "release-files/WoW-Launcher-v${{ needs.check-release.outputs.version }}.tar.gz"
          fi
          
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-release.outputs.version }}
          name: WoW Launcher v${{ needs.check-release.outputs.version }}
          body: |
            ## WoW 3.3.5a Launcher Release v${{ needs.check-release.outputs.version }}

            ### 🚀 **Cross-Platform WoW Launcher**
            A modern, feature-rich launcher for World of Warcraft 3.3.5a with automatic Wine installation and addon management.

            ### 📦 **Downloads:**
            - **Windows**: Download the `Setup.exe` for easy installation or the portable `.exe` for no-install usage
            - **macOS**: Download the `.dmg` file for Mac installation
            - **Linux**: Download the `.AppImage` for universal Linux support, or use `.deb`/`.rpm` for package managers

            ### ✨ **Key Features:**
            - 🍷 **Automatic Wine Installation** - Seamless cross-platform compatibility
            - 🔧 **Smart Action Button** - Context-aware download/launch functionality  
            - 📦 **GitHub Addon Manager** - Easy addon installation from repositories
            - ⚙️ **Environment Configuration** - Customizable via .env file
            - 🎨 **Modern UI** - Clean, responsive interface
            - 🌍 **Cross-Platform** - Windows, macOS, and Linux support

            ### 🛠️ **Installation:**
            1. Download the appropriate file for your operating system
            2. Install/run the application
            3. Configure your WoW installation path and server settings
            4. Launch and enjoy!

            ### 📋 **System Requirements:**
            - **Windows**: Windows 7 or later
            - **macOS**: macOS 10.13 or later
            - **Linux**: Most modern distributions

            Built with ❤️ using Electron and Node.js
          draft: false
          prerelease: false
          files: release-files/*
          fail_on_unmatched_files: false