name: Build and Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.40)'
        required: true
        type: string

permissions:
  contents: write
  
jobs:
  # Job to determine if we should create a release
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Determine version and validate
        id: check
        run: |
          if [[ ${{ github.event_name }} == 'workflow_dispatch' ]]; then
            # Manual trigger with version
            NEW_VERSION="${{ github.event.inputs.version }}"
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "Manual release triggered for version $NEW_VERSION"
          elif [[ ${{ github.ref }} == refs/tags/v* ]]; then
            # Tag-based release
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
            echo "Tag-based release for version $TAG_VERSION"
          else
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "Skipping release creation"
          fi

  # Build job for all platforms
  build:
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            platform: mac
            artifact-name: macos
          - os: ubuntu-latest
            platform: linux
            artifact-name: linux
          - os: windows-latest
            platform: win
            artifact-name: windows

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify .env file exists
        run: |
          echo "Checking for .env file..."
          if [ -f ".env" ]; then
            echo ".env file found!"
            echo "Contents:"
            cat .env
          else
            echo "ERROR: .env file not found!"
            exit 1
          fi
        shell: bash

      - name: Install Wine (for macOS cross-compilation)
        if: matrix.os == 'macos-latest'
        run: |
          brew install --cask xquartz wine-stable

      - name: Build application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            npm run build:mac
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            npm run build:linux
          else
            npm run build:win
          fi
        shell: bash

      - name: List build artifacts (Debug)
        run: |
          echo "Contents of dist folder:"
          ls -la dist/ || echo "No dist folder found"
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-build
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.snap
            dist/*.tar.gz
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          retention-days: 5

  # Release job - only runs on tag pushes
  release:
    needs: [check-release, build]
    runs-on: ubuntu-latest
    if: needs.check-release.outputs.should-release == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: |
          echo "=== Artifacts structure ==="
          ls -laR artifacts/
          echo "=== End of artifacts ==="

      - name: Generate Changelog
        id: changelog
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "v${{ needs.check-release.outputs.version }}" | head -n 1)
          
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, using all commits"
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          
          echo "Generating changelog from $PREVIOUS_TAG to HEAD"
          
          # Generate changelog with categories
          {
            echo "### 🚀 Features"
            git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges | grep -i "feat:" || echo "- No new features"
            echo ""
            echo "### 🐛 Bug Fixes"
            git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges | grep -i "fix:" || echo "- No bug fixes"
            echo ""
            echo "### 📚 Documentation"
            git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges | grep -i "docs:" || echo "- No documentation updates"
            echo ""
            echo "### 🔧 Maintenance"
            git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges | grep -iE "chore:|refactor:|perf:" || echo "- No maintenance updates"
            echo ""
            echo "### 📝 Other Changes"
            git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges | grep -viE "feat:|fix:|docs:|chore:|refactor:|perf:|\[skip ci\]|Bump version" || echo "- No other changes"
          } > formatted_changelog.txt
          
          echo "Changelog generated successfully"

      - name: Create Release with all artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-release.outputs.version }}
          name: PlusCraft Launcher v${{ needs.check-release.outputs.version }}
          body_path: formatted_changelog.txt
          append_body: true
          body: |
            ## PlusCraft Launcher Release v${{ needs.check-release.outputs.version }}

            ### 🚀 **Cross-Platform WoW Launcher**
            A modern, feature-rich launcher for World of Warcraft 3.3.5a with automatic Wine installation and addon management.

            ### 📦 **Downloads:**
            - **Windows**: Download the installer or portable `.exe` for no-install usage
            - **macOS**: Download the `.dmg` file for Mac installation (Intel & Apple Silicon)
            - **Linux**: Download the `.AppImage` for universal support, or use `.deb` for Debian/Ubuntu

            ### ✨ **Key Features:**
            - 🍷 **Automatic Wine/CrossOver Installation** - Seamless cross-platform compatibility
            - 🔧 **Smart Action Button** - Context-aware download/launch functionality  
            - 📦 **GitHub Addon Manager** - Easy addon installation from repositories
            - ⚙️ **Environment Configuration** - Customizable via .env file
            - 🎨 **Modern UI** - Clean, responsive interface
            - 🌍 **Cross-Platform** - Windows, macOS, and Linux support

            ### 🛠️ **Installation:**
            1. Download the appropriate file for your operating system
            2. Install/run the application
            3. Configure your WoW installation path and server settings
            4. Launch and enjoy!

            ### 📋 **System Requirements:**
            - **Windows**: Windows 7 or later
            - **macOS**: macOS 10.13 or later
            - **Linux**: Most modern distributions

            Built with ❤️ using Electron and Node.js
          draft: false
          prerelease: false
          files: |
            artifacts/windows-build/PlusCraft-Launcher*.exe
            artifacts/windows-build/latest.yml
            artifacts/windows-build/*.blockmap
            artifacts/macos-build/*.dmg
            artifacts/macos-build/latest-mac.yml
            artifacts/macos-build/*.blockmap
            artifacts/macos-build/*.zip
            artifacts/linux-build/*.AppImage
            artifacts/linux-build/latest-linux.yml
            artifacts/linux-build/*.deb
            artifacts/linux-build/*.tar.gz
          fail_on_unmatched_files: false